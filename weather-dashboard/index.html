<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title-fade">🌤️ Weather Dashboard</h1>
            <div class="search-box">
                <input 
                    type="text" 
                    id="cityInput" 
                    placeholder="Enter city name..." 
                    class="search-input"
                >
                <button id="searchBtn" class="search-btn">Search</button>
            </div>
        </header>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner hidden">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message hidden"></div>

        <!-- Main Weather Card -->
        <div id="weatherCard" class="weather-card hidden">
            <div class="current-weather">
                <div class="location-info slide-in-left">
                    <h2 id="cityName" class="city-name"></h2>
                    <p id="dateTime" class="date-time"></p>
                </div>
                <div class="weather-main slide-in-right">
                    <img id="weatherIcon" src="" alt="Weather Icon" class="weather-icon bounce">
                    <div class="temp-section">
                        <span id="temperature" class="temperature pulse"></span>
                        <p id="weatherDescription" class="weather-description"></p>
                    </div>
                </div>
            </div>

            <!-- Weather Details Grid -->
            <div class="weather-details">
                <div class="detail-card fade-in-up" style="animation-delay: 0.1s">
                    <h3>💧 Humidity</h3>
                    <p id="humidity" class="detail-value"></p>
                </div>
                <div class="detail-card fade-in-up" style="animation-delay: 0.2s">
                    <h3>💨 Wind Speed</h3>
                    <p id="windSpeed" class="detail-value"></p>
                </div>
                <div class="detail-card fade-in-up" style="animation-delay: 0.3s">
                    <h3>🌡️ Feels Like</h3>
                    <p id="feelsLike" class="detail-value"></p>
                </div>
                <div class="detail-card fade-in-up" style="animation-delay: 0.4s">
                    <h3>🔽 Pressure</h3>
                    <p id="pressure" class="detail-value"></p>
                </div>
                <div class="detail-card fade-in-up" style="animation-delay: 0.5s">
                    <h3>👁️ Visibility</h3>
                    <p id="visibility" class="detail-value"></p>
                </div>
                <div class="detail-card fade-in-up" style="animation-delay: 0.6s">
                    <h3>☁️ Cloudiness</h3>
                    <p id="clouds" class="detail-value"></p>
                </div>
            </div>
        </div>

        <!-- 5-Day Forecast -->
        <div id="forecastSection" class="forecast-section hidden">
            <h2>5-Day Forecast</h2>
            <div id="forecastContainer" class="forecast-container"></div>
        </div>

        <!-- Default Message -->
        <div id="defaultMessage" class="default-message fade-in">
            <p>🔍 Search for a city to see the weather forecast</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
